title: 'Fault and downtime analysis (supports ROSP-11, ROSP-12)'
description: >-
  Diagnostic supporting ROSP-11 and ROSP-12, in development: per-night lost-time
  partition (weather / fault / downtime / idle) from EFD observatory status and the
  shared ROSP-42 state override file, reduced by the ROSP-24 v1.0 precedence (pending
  sign-off), with each fault run charged to its primary CSC in the ROSP-24 attribution
  groups, per-component fault rates and recovery times, and cross-checks against the
  narrative log (annotation only). Not an official metric page.
authors:
  - name: Brian Stalder
tags:
  - pth
  - diagnostic
  - category-1
parameters:
  start_dayobs:
    type: integer
    description: First dayObs (inclusive)
    default: 20260629
  end_dayobs:
    type: integer
    description: Last dayObs (inclusive)
    default: 20261231
