title: 'ROSP-2: Delivered image quality (including atmosphere)'
description: >
  Delivered PSF FWHM (psf_sigma_median converted to FWHM) of LSSTCam science visits, per band and for all
  bands, as delivered and corrected to zenith / 500 nm: median with 25 / 75 % per band, nightly series
  with quartile whiskers, and overlaid histograms. PTH Tier 1 metric, draft method.
authors:
  - name: Elana Urbach
tags:
  - pth
  - tier-1
  - rosp-02
  - category-2
  - layer-1
parameters:
  start_dayobs:
    type: integer
    description: First dayObs (inclusive)
    default: 20260629
  end_dayobs:
    type: integer
    description: Last dayObs (inclusive)
    default: 20261231
  science_programs:
    type: string
    description: Comma-separated science programs (bare numbers become BLOCK-<n>); empty for all programs
    default: "407, 408, 416, 417, 419, 421"
  use_cache:
    type: boolean
    description: Cache the ConsDB pull as parquet under ./cache (only honoured outside Times Square)
    default: false
